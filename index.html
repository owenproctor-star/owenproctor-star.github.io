<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5a1226">
<title>Owen Proctor</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235a1226'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' text-anchor='middle' fill='%23f7eee2'%3EOP%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --burgundy: #5a1226;
    --cream: #f7eee2;
    --muted: #e0cdc4;
    --accent: #eec48f;
    --rule: rgba(247, 238, 226, .22);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--burgundy);
    color: var(--cream);
    font: 1.0625rem/1.65 var(--sans);
  }
  main, footer {
    width: 100%;
    max-width: 50rem;
    margin-inline: auto;
    padding-inline: clamp(1.5rem, 6vw, 3rem);
  }
  main { flex: 1; padding-block: clamp(4rem, 16vh, 9rem) 4rem; }
  a { color: inherit; text-decoration-color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .22em; }
  a:hover { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  .photo { display: block; width: 8rem; height: 8rem; object-fit: cover; border-radius: 50%; margin-bottom: 2rem; }
  h1 {
    font: 400 clamp(3rem, 11vw, 5.5rem)/1.02 var(--serif);
    letter-spacing: -.015em;
  }
  .credentials { font-size: .36em; letter-spacing: 0; color: var(--muted); white-space: nowrap; margin-left: .3em; }
  .role { margin-top: 1.25rem; font: 1.375rem/1.35 var(--serif); color: var(--accent); }
  .headline { margin-top: .5rem; color: var(--muted); max-width: 36rem; }
  .contact { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; margin-top: 2rem; padding: 0; list-style: none; overflow-wrap: anywhere; }

  section {
    display: grid;
    gap: .75rem;
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
  }
  main > header + section { margin-top: 4.5rem; }
  h2 { font: 600 .8125rem/1.5 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
  .about p + p { margin-top: 1em; }
  .items { display: grid; gap: 1.5rem; padding: 0; list-style: none; }
  .item-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 1rem; }
  .item-title { font: 1.1875rem/1.4 var(--serif); }
  .dates, .org { color: var(--muted); font-size: .9375rem; }
  .details { margin-top: .35rem; }
  .tags { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; list-style: none; }
  .tags li { padding: .1rem .75rem; border: 1px solid var(--rule); border-radius: 99px; font-size: .9375rem; }

  footer { padding-block: 1.5rem 2rem; color: var(--muted); font-size: .875rem; }

  @media (min-width: 40rem) {
    section { grid-template-columns: 10rem 1fr; gap: 2rem; }
    h2 { padding-top: .25rem; }
  }
</style>
</head>
<body>
<main id="site"></main>
<footer id="footer"></footer>

<script src="content.js"></script>
<script>
  // Builds the page from content.js. Nothing here needs editing.
  const S = window.SITE;

  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
    node.append(...kids.filter(Boolean));
    return node;
  }

  function header() {
    const name = el("h1", null, S.name);
    if (S.credentials) name.append(el("span", { class: "credentials" }, S.credentials));

    const role = [S.title, S.location].filter(Boolean).join(" · ");
    const contacts = [
      S.email && [S.email, "mailto:" + S.email],
      S.phone && [S.phone, "tel:" + S.phone.replace(/[^\d+]/g, "")],
      S.linkedin && ["LinkedIn", S.linkedin],
      S.resume && ["Résumé", S.resume],
      ...(S.links || []).map(link => [link.label, link.url]),
    ].filter(Boolean);

    return el("header", null,
      S.photo && el("img", { class: "photo", src: S.photo, alt: S.name }),
      name,
      role && el("p", { class: "role" }, role),
      S.headline && el("p", { class: "headline" }, S.headline),
      contacts.length && el("ul", { class: "contact" },
        ...contacts.map(([text, href]) => el("li", null, el("a", { href }, text)))),
    );
  }

  function section(heading, body) {
    return el("section", null, el("h2", null, heading), body);
  }

  function item(entry) {
    const title = entry.url ? el("a", { href: entry.url }, entry.title || entry.url) : entry.title;
    return el("li", null,
      el("div", { class: "item-head" },
        title && el("div", { class: "item-title" }, title),
        entry.dates && el("div", { class: "dates" }, entry.dates)),
      entry.org && el("div", { class: "org" }, entry.org),
      entry.details && el("p", { class: "details" }, entry.details),
    );
  }

  function list(items) {
    if (items.every(entry => typeof entry === "string")) {
      return el("ul", { class: "tags" }, ...items.map(text => el("li", null, text)));
    }
    return el("ul", { class: "items" },
      ...items.map(entry => typeof entry === "string" ? item({ title: entry }) : item(entry)));
  }

  const site = document.getElementById("site");
  site.append(header());

  if (S.about && S.about.trim()) {
    const paragraphs = S.about.trim().split(/\n\s*\n/).map(text => el("p", null, text));
    site.append(section("About", el("div", { class: "about" }, ...paragraphs)));
  }
  for (const { heading, items } of S.sections || []) {
    if (items && items.length) site.append(section(heading, list(items)));
  }

  const summary = [S.name, S.title, S.location].filter(Boolean);
  document.title = S.title ? `${S.name} | ${S.title}` : S.name;
  document.querySelector('meta[name="description"]').content = S.headline || summary.join(", ");
  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${S.name}`;
</script>
</body>
</html>
